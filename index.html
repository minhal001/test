<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfluenceCA — Find Canadian Influencers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-inner">
        <div class="brand">
            <span class="brand-maple">&#127809;</span>
            <span class="brand-name">InfluenceCA</span>
            <span class="brand-tag">Canada's Influencer Directory</span>
        </div>
        <div class="header-stats" id="headerStats">
            <span class="stat-pill" id="totalCount">Loading...</span>
        </div>
    </div>
</header>

<!-- Search & Filters -->
<div class="filters-bar">
    <div class="filters-inner">

        <!-- Search -->
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><line x1="12.8" y1="12.8" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name, handle, or keyword…" oninput="applyFilters()">
            <button class="clear-btn" id="clearSearch" onclick="clearSearch()" title="Clear search">&#10005;</button>
        </div>

        <!-- Province -->
        <select id="filterProvince" class="filter-select" onchange="applyFilters()">
            <option value="">All Provinces</option>
            <option value="AB">Alberta</option>
            <option value="BC">British Columbia</option>
            <option value="MB">Manitoba</option>
            <option value="NB">New Brunswick</option>
            <option value="NL">Newfoundland &amp; Labrador</option>
            <option value="NS">Nova Scotia</option>
            <option value="ON">Ontario</option>
            <option value="PE">Prince Edward Island</option>
            <option value="QC">Québec</option>
            <option value="SK">Saskatchewan</option>
        </select>

        <!-- Niche -->
        <select id="filterNiche" class="filter-select" onchange="applyFilters()">
            <option value="">All Niches</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Fashion">Fashion</option>
            <option value="Food">Food &amp; Drink</option>
            <option value="Fitness">Fitness &amp; Health</option>
            <option value="Travel">Travel</option>
            <option value="Tech">Tech</option>
            <option value="Beauty">Beauty</option>
            <option value="Gaming">Gaming</option>
            <option value="Finance">Finance</option>
            <option value="Parenting">Parenting</option>
            <option value="Comedy">Comedy</option>
            <option value="Music">Music</option>
            <option value="Outdoors">Outdoors &amp; Nature</option>
            <option value="Business">Business</option>
            <option value="Sports">Sports</option>
        </select>

        <!-- Platform -->
        <select id="filterPlatform" class="filter-select" onchange="applyFilters()">
            <option value="">All Platforms</option>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
            <option value="YouTube">YouTube</option>
            <option value="X">X (Twitter)</option>
            <option value="Twitch">Twitch</option>
            <option value="Podcast">Podcast</option>
        </select>

        <!-- Followers -->
        <select id="filterSize" class="filter-select" onchange="applyFilters()">
            <option value="">Any Size</option>
            <option value="nano">Nano (&lt;10K)</option>
            <option value="micro">Micro (10K–100K)</option>
            <option value="mid">Mid-tier (100K–500K)</option>
            <option value="macro">Macro (500K–1M)</option>
            <option value="mega">Mega (1M+)</option>
        </select>

        <!-- Sort -->
        <select id="sortBy" class="filter-select" onchange="applyFilters()">
            <option value="followers_desc">Most Followers</option>
            <option value="followers_asc">Fewest Followers</option>
            <option value="engagement_desc">Best Engagement</option>
            <option value="name_asc">Name A–Z</option>
        </select>

        <button class="reset-btn" onclick="resetFilters()">Reset</button>
    </div>
</div>

<!-- Active filter chips -->
<div class="chips-bar" id="chipsBar"></div>

<!-- Results area -->
<main class="results-area">
    <div class="results-header" id="resultsHeader"></div>
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="no-results" id="noResults" style="display:none">
        <div class="no-results-icon">&#128269;</div>
        <div class="no-results-text">No influencers match your filters</div>
        <button class="reset-btn" onclick="resetFilters()">Clear filters</button>
    </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModalDirect()">&#10005;</button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
